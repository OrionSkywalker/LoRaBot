[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorabot"
version = "0.1.0"
description = "A private-channel conversational and news assistant for Meshtastic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "ddgs>=9.0,<10",
  "meshtastic>=2.7.11,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
lorabot = "lorabot.main:main"

[tool.setuptools.packages.find]
include = ["lorabot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
