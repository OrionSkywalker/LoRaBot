[meshtastic]
# "auto" is recommended when only one Meshtastic radio is connected. For a
# stable production path, use /dev/serial/by-id/... from the setup guide.
serial_port = auto

# A private secondary channel is normally index 1. The bot ignores every other
# channel and replies directly to the requesting node on this channel.
channel_index = 1
require_direct_message = false
allowed_node_ids =
wake_word =

[assistant]
name = LoRaBot
system_prompt = You are LoRaBot, a concise and friendly assistant reached over a low-bandwidth Meshtastic radio. Answer directly and honestly. Say when you are uncertain. Never claim to have current information unless web-search context was supplied.
history_turns = 4
max_response_chars = 620
chunk_bytes = 180
max_chunks = 4
thinking_message = LoRaBot: thinking...

[ollama]
url = http://127.0.0.1:11434
model = llama3.2:3b
timeout_seconds = 120
context_tokens = 2048
max_output_tokens = 180
temperature = 0.3
keep_alive = 10m

[news]
sources_file = sources.json
max_articles = 6
items_per_feed = 8
request_timeout_seconds = 12

[web]
enabled = true
provider = ddgs
region = us-en
safesearch = moderate
max_results = 4
timeout_seconds = 10

[radio]
message_delay_seconds = 2.5
channel_quiet_seconds = 3.0
want_ack = true
queue_size = 12
requests_per_hour = 12
